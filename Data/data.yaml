# ==============================================================================
# data.yaml — Central configuration for all agents, markets, and ADMM settings
# ==============================================================================

# ---------------------------------------------------------------------------
# General: Temporal dimensions and reference year
# ---------------------------------------------------------------------------
General:
  nTimesteps: 24       # Hours per representative day (24 = hourly resolution; standard for power-system models)
  nReprDays: 8         # Number of representative days (8 for finer temporal resolution and H2 price analysis)
  nYears: 1            # Number of years for social_planner.jl (kept at 1: base scenario only)
  base_year: 2021      # Calendar year whose timeseries data is used (2021 chosen as a recent year with complete public data)

# ---------------------------------------------------------------------------
# ADMM: Alternating Direction Method of Multipliers global settings
# ---------------------------------------------------------------------------
ADMM:
  rho_initial: 1.0      # Standard starting penalty weight for the augmented Lagrangian; 1.0 is a neutral default that avoids biasing toward primal or dual convergence
  rho_cap_initial: 0.1  # Penalty for investment/capacity consensus; low initial to avoid over-constraining early iterations
  nScenarioYears: 10    # Number of scenario years used by market_exposure*.jl (2021..2030)
  max_iter: 1000         # Iteration budget
  epsilon: 0.1          # Base absolute tolerance used in Boyd-style stopping tests for market_exposure
  epsilon_contracts: 1.0 # [market_exposure_contracts only] Dedicated tolerance for contracts mode (falls back to epsilon if omitted)
  cap_tol_relax: 100   # [market_exposure_contracts only] Multiplier for capacity consensus tolerance. Effective cap tolerance = standard × cap_tol_relax. Larger values allow convergence when flow markets are close but capacity lags (stronger coupling in contracts case).
  gamma: 0.5              # Risk weight for CVaR (γ=1 ⇒ risk-neutral). Used by both social planner and ADMM agents. Change here to update both simultaneously.
  beta: 0.95            # CVaR confidence level τ (e.g. 0.95 = worst 5% of scenarios). Used by both social planner and ADMM agents.

# ---------------------------------------------------------------------------
# SocialPlanner: solver configuration for social_planner.jl only
# ---------------------------------------------------------------------------
SocialPlanner:
  solver: ipopt         # Social-planner solver ("ipopt" recommended; "gurobi" optional). ADMM continues to use Gurobi.
  ipopt_tol: 1.0e-8     # IPOPT NLP convergence tolerance for SP solve.
  ipopt_max_iter: 5000  # IPOPT iteration cap for SP solve.

# ---------------------------------------------------------------------------
# Market initial prices and penalty weights
# Each market has:
#   initial_price — Scalar seed for the 3D ADMM price array λ[jh,jd,jy].
#                   Chosen as a reasonable starting guess to help ADMM converge
#                   faster by starting near equilibrium. If social planner results
#                   are available, the mean prices will be used to ensure warm-start.
#   rho_initial   — Per-market ADMM penalty parameter; balances convergence
#                   speed vs. oscillation. Lower values for markets needing
#                   gentler convergence (e.g. GC markets with smaller volumes).
# ---------------------------------------------------------------------------
elec_market:
  initial_price: 75.0   # €/MWh — NL 2021 day-ahead order-of-magnitude (pre-Q4 spike average)
  rho_initial: 1.0      # Penalty weight for electricity; 1.0 matches the global default (largest, most liquid market)
elec_GC_market:
  initial_price: 10.0   # €/MWh_GC — Warm-start from social planner equilibrium
  rho_initial: 0.3      # Lower penalty: GC market has smaller volumes & price ranges; gentler convergence avoids oscillation
H2_market:
  initial_price: 50.0   # €/MWh_H2 — Warm-start from social planner equilibrium
  rho_initial: 0.5      # Moderate penalty: H2 market is tightly coupled to electricity through the electrolyzer
H2_GC_market:
  initial_price: 30.0    # €/MWh_GC — Warm-start from social planner equilibrium
  rho_initial: 1.0       # Moderate penalty: needs stronger consensus pressure than a thin annual market

# ---------------------------------------------------------------------------
# EP (End-Product) market — Coordination market for ammonia / downstream product
# ---------------------------------------------------------------------------
EP_market:
  # NL calibration (ammonia as EP, LHV 18.6 MJ/kg ≈ 5.17 MWh/t):
  #   ~3 Mt NH₃/year → ~15.5 TWh_EP/year via D_EP = Total_Demand × LOAD_EP and repr-day weights.
  #   ~1000 €/t NH₃ → ~194 €/MWh_EP (1000 / 5.17).
  initial_price: 194.0      # €/MWh_EP — Warm-start near NL wholesale ammonia (~1000 €/t)
  rho_initial: 3.0          # Larger penalty: EP market is stiff (few participants, large price swings) and needs stronger coupling
  Demand_Column: "LOAD_EP"  # Column in the timeseries CSV that holds the normalized EP demand profile (inelastic)
  Total_Demand: 1970.0      # Scales D_EP; annual EP ≈ Total_Demand × Σ W[jd]×LOAD_EP ≈ 15.5 TWh/y (3 Mt NH₃/y)
# ---------------------------------------------------------------------------
# Power-sector agents
# ---------------------------------------------------------------------------
Power:
  # NL 2021 aggregate VRES (CBS installed capacity, MWp/MW; base_year timeseries 2021).
  # Variable Renewable Energy Source (solar — national aggregate)
  Gen_VRES_Solar:
    Type: "VRES"
    Capacity: 14823.0         # MW — CBS end-2021 solar PV (~14.8 GW)
    Profile_Column: "SOLAR"    # Column in timeseries CSV with hourly capacity factors (0–1) for this VRES unit
    MarginalCost: 0.0          # €/MWh — Zero marginal cost: no fuel; incentivises full dispatch whenever available
    FixedCost_per_MW: 70000.0  # €/MW-year — Annualised CAPEX + fixed O&M for utility-scale solar
    gamma: 0.5                   # Risk weight for CVaR (γ=1 ⇒ risk-neutral even though risk terms are present structurally).
    beta: 0.95                 # CVaR confidence level τ (placeholder; only active when gamma<1).

  # Variable Renewable Energy Source (wind — national aggregate, on+offshore)
  Gen_VRES_Wind:
     Type: "VRES"
     Capacity: 7700.0          # MW — CBS end-2021 wind (~7.7 GW)
     Profile_Column: "WIND"     # Column in timeseries CSV with hourly capacity factors (0–1) for this VRES unit
     MarginalCost: 0.0          # €/MWh — Zero marginal cost: no fuel; incentivises full dispatch whenever available
     FixedCost_per_MW: 90000.0  # €/MW-year — Slightly higher than solar (on/offshore mix, grid connection)
     gamma: 0.5                   # Risk weight for CVaR (γ=1 ⇒ risk-neutral even though risk terms are present structurally).
     beta: 0.95                 # CVaR confidence level τ (placeholder; only active when gamma<1).

  # Dispatchable conventional fleet proxy — NL gas-dominated residual (2021)
  Gen_Conv_01:
    Type: "Conventional"
    Capacity: 16000.0        # MW — Dispatchable thermal/gas fleet (~16 GW); covers peak when VRES is low
    MarginalCost: 65.0       # Legacy fallback used only if StageBaseCosts/FinalMarginalCost are omitted
    # 3-stage curve: small coal/biomass residual + dominant CCGT/OCGT gas (NL merit order).
    StageCapacityShares: [0.08, 0.12, 0.80]  # Coal-like / biomass-like / gas (NL ≈ 80% gas in fossil stack)
    StageBaseCosts: [45.0, 65.0, 80.0]       # €/MWh — 2021-era variable cost floors by fuel block
    FinalMarginalCost: 130.0                 # €/MWh — Peaking gas / high-load tail

  # Electricity consumer with elastic (quadratic) demand — NL national load
  # Quadratic utility: U(d) = A_E·d − ½·B_E·d²  →  inverse demand p(d) = A_E − B_E·d
  Cons_Elec_01:
    Type: "Consumer"
    PeakLoad: 20000.0        # MW — NL system peak ~20 GW; annual load ≈ PeakLoad×Σ W×LOAD_E ≈ 117 TWh/y
    Load_Column: "LOAD_E"    # Column in timeseries CSV with the normalized electricity load profile
    A_E: 500.0               # €/MWh — Intercept of inverse demand curve; willingness to pay for the first MW (high to ensure demand is met)
    B_E: 0.0025              # €/MWh² — Scaled for ~20 GW scale (was 0.5 at 55 MW peak); keeps elasticity at system level

# ---------------------------------------------------------------------------
# Hydrogen producers (electrolysis)
# ---------------------------------------------------------------------------
Hydrogen:
  Prod_H2_Green:
    Type: "GreenProducer"
    Capacity_Electrolyzer: 800.0              # MW_elec — Sized for green NH₃ route (~533 MW_H2 out at SC=1.5)
    Capacity_H2_Output: 533.0                  # MW_H2 — Matches Offtaker_Green H₂ intake (NL green-ammonia share)
    SpecificConsumption: 1.5                  # MWh_elec per MWh_H2 produced (i.e. efficiency = 1/1.5 ≈ 67%); typical PEM electrolyzer value
    OperationalCost: 3.0                       # €/MWh_H2 — Variable O&M for water treatment, stack degradation, etc.
    FixedCost_per_MW_Electrolyzer: 400000.0   # €/MW_elec-year — Annualised CAPEX; high value limits electrolyzer expansion
    gamma: 0.5                                  # Risk weight for CVaR (γ=1 ⇒ risk-neutral baseline).
    beta: 0.95                                # CVaR confidence level τ.

# ---------------------------------------------------------------------------
# Hydrogen offtakers (downstream processors & importers)
# ---------------------------------------------------------------------------
Hydrogen_Offtaker:
  # Green offtaker — converts H2 into end product using only green hydrogen
  Offtaker_Green:
    Type: "GreenOfftaker"
    Capacity_H2_In: 533.0              # MW_H2 — ~20% of NL ammonia nameplate (green/electrolysis route)
    Capacity_EP_Out: 400.0             # MW_EP — 0.75 × 533 ≈ 400; initial cap for endogenous expansion
    Alpha: 0.75                        # H2-to-EP conversion ratio (MWh_EP per MWh_H2). 0.75 means 1 MWh_H2 yields 0.75 MWh_EP of NH3, consistent with typical industrial Haber–Bosch efficiencies (≈70–80% on an LHV basis).
    ProcessingCost: 7.0                # €/MWh_EP — Cost of converting H2 to end product (energy, catalysts, labour)
    FixedCost_per_MW_EP_Out: 120000.0  # €/MW_EP-year — Annualised CAPEX for downstream synthesis/processing (e.g. ammonia plant). Assumes ≈1.2 M€/MW_EP CAPEX, 20-year lifetime, 8% WACC; annuity factor ≈0.10 ⇒ ≈120 k€/MW-year.
    gamma: 0.5                           # Risk weight for CVaR (γ=1 ⇒ risk-neutral baseline).
    beta: 0.95                         # CVaR confidence level τ.

  # Grey offtaker — uses conventional (grey) hydrogen but must buy H2 GCs for a fraction of its implied H2 use
  Offtaker_Grey:
    Type: "GreyOfftaker"
    Capacity: 1570.0          # MW_EP — domestic conventional route (~80% of NL ammonia nameplate; includes former import share)
    MarginalCost: 120.0       # €/MWh_EP — Below NL-equilibrium (~194) so grey can clear; still above variable-only floor
    gamma_NH3: 0.75           # EP-to-H2 conversion ratio for grey offtaker (MWh_EP per MWh_H2). 0.75 means 1 MWh_H2 yields 0.75 MWh_EP of NH3; we infer implied H2 use from observed EP output via H2_intake ≈ EP / gamma_NH3 when applying the 42% green H2 GC mandate.

  # EP importer — disabled for now (domestic supply only)
  Offtaker_Import:
    Type: "EPImporter"
    Capacity: 0.0             # MW_EP — No imports; all ammonia met by green + grey offtakers
    ImportCost: 250.0         # €/MWh_EP — Unused at zero capacity; kept for re-enabling imports later

# ---------------------------------------------------------------------------
# Electricity Guarantees-of-Origin (GC) demand agent
# Quadratic utility: U(d) = A_GC·d − ½·B_GC·d²  →  inverse demand p(d) = A_GC − B_GC·d
# (Same functional form as the electricity consumer, applied to GC certificates)
# ---------------------------------------------------------------------------
Electricity_GC_Demand:
  Demand_GC_Elec_01:
    Type: "GC_Demand"
    PeakLoad: 18000.0         # MWh_GC/h scale — NL-order GO demand proxy (elastic mandate buyer)
    Load_Column: "LOAD_EP"
    A_GC: 55.0                # €/MWh_GC
    B_GC: 0.35                # €/MWh_GC²

# ---------------------------------------------------------------------------
# EP Demand — Currently empty: EP demand is inelastic and fully defined by
# EP_market.Total_Demand × normalized profile. This block is a placeholder
# for future elastic (if any) EP demand agents.
# ---------------------------------------------------------------------------
EP_Demand: {}

# ---------------------------------------------------------------------------
# PPAs — Power Purchase Agreements (VRES ↔ H2 producer)
# Used ONLY by market_exposure_contracts.jl. Ignored by market_exposure.jl
# and social_planner.jl.
#
# VRES and the electrolyzer can enter PPAs: each VRES has its own PPA
# sub-market. The H2 producer can contract with Solar, Wind, or both at
# different prices. PPA bundles electricity + elec_GC (real-world: buyer
# receives both, pay-as-produced). VRES commits ppa_cap (MW); electrolyzer
# receives elec+GC package. Per-VRES λ_ppa (€/MWh) cleared by each PPA market.
# ---------------------------------------------------------------------------
PPAs:
  initial_price: 60.0    # €/MWh — Default seed for PPA bundled price (pay-as-produced)
  rho_initial: 0.5       # ADMM penalty for PPA market (moderate: thin market)
  pricing_mode: "endogenous_clearing"  # "endogenous_clearing" | "fixed" | "indexed"
  fixed_strike: 60.0     # €/MWh, used when pricing_mode = "fixed"
  # Indexed strike uses affine rule:
  # K = constant + elec*λ_elec + elec_GC*λ_elec_GC + H2*λ_H2 + H2_GC*λ_H2_GC + EP*λ_EP
  index_terms:
    constant: 0.0
    elec: 1.0
    elec_GC: 0.0
    H2: 0.0
    H2_GC: 0.0
    EP: 0.0
  price_floor: 0.0
  price_cap: 10000.0
  # Per-VRES initial prices (optional overrides; falls back to initial_price if absent)
  Gen_VRES_Solar:
    initial_price: 55.0  # €/MWh — Solar-specific PPA price seed
  Gen_VRES_Wind:
    initial_price: 65.0  # €/MWh — Wind-specific PPA price seed

# ---------------------------------------------------------------------------
# HPAs — Hydrogen Purchase Agreements (GreenProducer ↔ GreenOfftaker)
# Used ONLY by market_exposure_contracts.jl.
#
# Same pay-as-produced structure as PPAs, but for bundled H2 + H2_GC.
# The settlement strike K_hpa can be:
#   - endogenous_clearing: recovered from HPA supply-demand clearing (default)
#   - fixed: exogenous fixed strike
#   - indexed: affine indexation to model prices (coefficients below)
# ---------------------------------------------------------------------------
HPAs:
  initial_price: 80.0
  rho_initial: 0.5
  pricing_mode: "endogenous_clearing"
  fixed_strike: 80.0
  index_terms:
    constant: 0.0
    elec: 0.0
    elec_GC: 0.0
    H2: 1.0
    H2_GC: 0.0
    EP: 0.0
  price_floor: 0.0
  price_cap: 10000.0
  Prod_H2_Green:
    initial_price: 80.0